{% extends "base/base.html" %}

{% block content %}

<h1>{{ trans(key="tags_title", lang=lang) }}</h1>
<div class="tags-list">
  <ul>
    {% for term in terms %}
    <li class="tags-list-item">
      <a href="{{ term.permalink | safe }}">
        {{ term.name | capitalize }}({{ term.page_count }})
      </a>
    </li>
    {% endfor %}
  </ul>
</div>

{% endblock content %}
